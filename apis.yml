name: Auxos
description: >-
  Auxos is an AI-powered customer research platform that builds 1:1 AI clones of
  a company's real customers to simulate how they respond to business decisions
  before those decisions ship. The company recruits and interviews real people
  matching a client's ideal customer profile, then models each participant as an
  always-on AI avatar grounded in that interview data. Teams use the resulting
  synthetic audience to test surveys, messaging, ad creative, pricing, and
  product flows and retrieve population-scale quantitative results plus
  qualitative commentary in minutes rather than the weeks traditional market
  research takes. Auxos is a Y Combinator (Spring 2026) company founded by Ashton
  Daniel, Jerry Wu, and Kerry Lu, targeting marketing, product, and research
  teams. This profile is maintained by API Evangelist; as of enrichment Auxos
  publishes no public developer or API surface.
